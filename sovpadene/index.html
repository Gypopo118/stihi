    <article>
      <h1>Совпаденье</h1>
      <time datetime="11.07.2016">11.07.2016</time>
      <div class="seo-poem__text"><p>В порыве прелести нечаянной,<br>
Ум потерявшая ледышка,<br>
Ты свет как осень излучаешь,<br>
Как роща ветреная дышишь.</p>
<p>Ты - совпаденье струй и холода,<br>
Слиянье ливня и волос.<br>
И небо молнией расколото,<br>
И всё в душе отозвалось.</p>
<p>2002</p></div>
