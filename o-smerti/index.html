    <article>
      <h1>О смерти</h1>
      <time datetime="18.12.2012">18.12.2012</time>
      <div class="seo-poem__text"><p>Когда замолчат провода,<br>
ты платье наденешь простое,<br>
и я рассмеюсь навсегда<br>
в лицо твое немолодое.</p>
<p>Дороги замкнулись. И снег<br>
на белых ладонях не тает,<br>
и черные ветви во сне<br>
в вечернее небо взлетают.</p>
<p>2002 г.</p></div>
    </article>
