      <h1>Останешься</h1>
      <time datetime="16.01.2014">16.01.2014</time>
      <div class="seo-poem__text"><p>Ночная бабочка<br>
в лунном свеченьи сверкнет<br>
и рассыплется.<br>
А ты останешься прежней:<br>
предчувствие ожога,<br>
черным светящийся лед.</p>
<p>2003 г.</p></div>
