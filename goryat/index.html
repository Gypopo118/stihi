    <article>
      <h1>Горят</h1>
      <time datetime="07.07.2018">07.07.2018</time>
      <div class="seo-poem__text"><p>Я раздвигаю ветви сада<br>
тугого, юного, как ты.<br>
Тут нет плодов, но и не надо,<br>
ведь я любитель пустоты.</p>
<p>Горят, подбитые закатом,<br>
вороны в небе золотом,<br>
и тихая Земля, как атом,<br>
мерцает в космосе пустом.</p></div>
    </article>
