        <h1>Недотрога</h1>
        <time datetime="01.12.2018">01.12.2018</time>
        <div class="seo-poem__text"><p>Летит снежинка-недотрога –<br>
её на руку посади.<br>
Какая длинная дорога<br>
у нас осталась позади!<br>
Густые, тихие метели<br>
скреблись в огромное окно,<br>
и птицы белые летели<br>
и, тая, падали на дно.<br>
Отдай мне меркнущие руки,<br>
отдай мне солнечный испуг.<br>
Среди божественной разрухи<br>
уже не вырваться из пут.<br>
Мне остается только голос,<br>
твой лепет остаётся мне,<br>
и ветви, стынущие голо<br>
в немилосердной вышине.</p></div>
      </article>
    </main>
