    <article>
      <h1>Последнее</h1>
      <time datetime="20.07.2019">20.07.2019</time>
      <div class="seo-poem__text"><p>Беспамятная осень тугоуха.<br>
Кричит металл, расстроенный до слёз.<br>
Как сердце, в паутине бьется муха<br>
меж ребер покосившихся берез.</p>
<p>Рассыпчатые птицы омертвели<br>
и высохли с ветвями заодно,<br>
и там, где окна раньше розовели,<br>
горит моё последнее окно.</p>
<p>28.05.19</p></div>
