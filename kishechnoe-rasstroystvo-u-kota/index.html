        <h1>Кишечное расстройство у кота</h1>
        <time datetime="23.10.2014">23.10.2014</time>
        <div class="seo-poem__text"><p>Позыв, позыв, отчаянный позыв,<br>
И страстный кот летит, подобный пуле,<br>
И, на песочек лапки возложив,<br>
Стал недвижим, как фараон на стуле.</p>
<p>Пустынный кот печален и суров,<br>
Внушителен, как будто пирамида.<br>
Болит живот, но он не сыплет слов,<br>
В страданиях не подавая вида.</p>
<p>Кишечник, свитый судоргой, шумит,<br>
Кот вытянулся, став довольно шаток,<br>
Он глазки закатил и весь дрожит<br>
На перекрестке слабосильных лапок.</p>
<p>И вздрогнул хвост, и вспыхнули глаза,<br>
Волна тугая тело охватила,<br>
И на песок обрушилась гроза,<br>
Как в первый раз, как с первозданной силой.</p>
<p>И кот спокойный слазит с пьедестала,<br>
Сует в песочек святотатный нос,<br>
И, оглянувшись мудро и устало,<br>
В который раз серчает на понос.</p>
<p>                1999г</p></div>
      </article>
