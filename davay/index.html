    <article>
      <h1>Давай</h1>
      <time datetime="01.10.2017">01.10.2017</time>
      <div class="seo-poem__text"><p>Зачем тебе слеза?<br>
Сережек черный хохот?<br>
Давай бежать в леса,<br>
В октябрьский строгий холод.<br>
Зачем тебе ладонь?<br>
Чтоб в ней держать запястье?<br>
Давай черпать ладов<br>
Несметные запасы.<br>
Зачем тебе колен<br>
Неверные суставы?<br>
Давай сдаваться в плен<br>
Друг другу всем составом.</p></div>
    </article>
