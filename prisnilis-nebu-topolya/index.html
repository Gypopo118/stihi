      <h1>Приснились небу тополя</h1>
      <time datetime="13.03.2014">13.03.2014</time>
      <div class="seo-poem__text"><p>Приснились небу тополя,<br>
приснилось утро туч далёких,<br>
и в пыльном ветре февраля -<br>
твои негреющие щёки.</p>
<p>В безумном небе крик ворон<br>
смешался с каменным молчаньем.<br>
Твой облик эхом повторён,<br>
и я был зрителем случайным.</p>
<p>2003 г.</p></div>
