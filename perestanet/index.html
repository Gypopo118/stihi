    <article>
      <h1>Перестанет</h1>
      <time datetime="28.04.2019">28.04.2019</time>
      <div class="seo-poem__text"><p>На дорогу выйти страшно -<br>
вой метельный впереди.<br>
Неожиданно и странно<br>
поселилась боль в груди.</p>
<p>Ветер в переулке стонет,<br>
обрывая провода.<br>
Поболит - и перестанет.<br>
Перестанет навсегда.</p>
<p>01.01.19</p></div>
    </article>
