      <h1>Под ногами скрежещет</h1>
      <time datetime="27.04.2017">27.04.2017</time>
      <div class="seo-poem__text"><p>Под ногами скрежещет крошево<br>
Голубого ночного льда.<br>
Не видать ничего  хорошего<br>
В эти темные холода.</p>
<p>Хороша лишь дорога длинная<br>
И в средине зимы младой<br>
Губ твоих ледяная линия<br>
И белеющая ладонь.</p>
<p>26.04.17</p></div>
