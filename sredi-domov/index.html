    <article>
      <h1>Среди домов</h1>
      <time datetime="26.05.2008">26.05.2008</time>
      <div class="seo-poem__text"><p>Со всей прозрачностью стекла<br>
среди домов, что не проснулись,<br>
ты медленной слезой стекла<br>
с лица невыспавшихся улиц.</p>
<p>Быть может, я не идиот,<br>
чтоб неизвестности касаться,<br>
но лужи все наперечет<br>
я помню. И они мне снятся.</p></div>
    </article>
  </main>
