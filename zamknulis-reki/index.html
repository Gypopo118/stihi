      <h1>Замкнулись реки</h1>
      <time datetime="29.11.2014">29.11.2014</time>
      <div class="seo-poem__text"><p>Замкнулись реки<br>
И ветви в воду<br>
Ушли. Целуя<br>
Тебя, проснулся я.<br>
В дожде светлеющем<br>
Ты видишь города<br>
Огни и тени.<br>
И шелест губ твоих<br>
Я слышу. Может быть<br>
Ты вспомнишь обо мне.</p>
<p>2002</p></div>
