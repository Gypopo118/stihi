    <article>
      <h1>Гуляли</h1>
      <time datetime="18.05.2024">18.05.2024</time>
      <div class="seo-poem__text"><p>Летел над нами тихий вой,<br>
земля дрожала как живая,<br>
и мы гуляли между войн,<br>
цветы горящие срывая.</p>
<p>Сквозь день куда-то шли бои<br>
в сиянии непобедимом,<br>
и пахли волосы твои<br>
весной, усталостью и дымом.</p></div>
    </article>
