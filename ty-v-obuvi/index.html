    <article>
      <h1>Ты в обуви</h1>
      <time datetime="25.12.2012">25.12.2012</time>
      <div class="seo-poem__text"><p>Ты в обуви и всё в тоске.<br>
Уснуло солнце на песке.</p>
<p>Ушли в себя антенны мира.<br>
Где твоего безумья мера?</p>
<p>Ты в обуви и всё вдали.<br>
Метели небо замели.</p>
<p>Уснуло солнце в тайнике.<br>
Ты в обуви и всё в тоске.</p>
<p>2002</p></div>
