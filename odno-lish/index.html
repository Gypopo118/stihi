    <article>
      <h1>Одно лишь</h1>
      <time datetime="29.05.2015">29.05.2015</time>
      <div class="seo-poem__text"><p>Полночный желтый свет барака<br>
сугробом тускло отражен,<br>
и надвигается из мрака<br>
тревожный, леденящий сон.</p>
<p>Свет выключили. Больше нет<br>
барака, снега, лишь молчанье,<br>
и в пустоте ушедших лет -<br>
одно лишь звездное сиянье.</p>
<p>2000</p></div>
