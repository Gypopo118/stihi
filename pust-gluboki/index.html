      <h1>Пусть глубоки</h1>
      <time datetime="17.04.2014">17.04.2014</time>
      <div class="seo-poem__text"><p>Пусть ветра вздохи глубоки,<br>
приду, увижу, померещусь.<br>
А ты движением руки<br>
стираешь пыль с красивой вещи.</p>
<p>В луче вечернего окна<br>
я в общем холоде растаю,<br>
и ты на миг потрясена,<br>
и стынет улица пустая.</p>
<p>15.08.1999г</p></div>
