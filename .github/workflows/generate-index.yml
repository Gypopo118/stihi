name: Generate public poetry pages

on:
  push:
    branches: [main]
    paths:
      - 'poems/**/*.md'
      - 'order.txt'
      - 'scripts/generate-seo.py'
  workflow_dispatch: {}

jobs:
  build-public-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate public pages and sitemap
        run: python3 scripts/generate-seo.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: generate public poetry pages"
          git push
