      <h1>Оря</h1>
      <time datetime="28.09.2018">28.09.2018</time>
      <div class="seo-poem__text"><p>Я выхожу во двор, оря<br>
В лицо сухое октября:<br>
Проснись, высокий пленник лени,<br>
И ужаснись всему вокруг,<br>
И, в грязь упавши на колени,<br>
Я обниму твою кору.<br>
Картавый крик собаки теплой<br>
Облекся паром в пустоте…<br>
Мы накричались. Я потопал<br>
В свой дом, что не видал гостей.</p></div>
