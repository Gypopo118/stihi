    <article>
      <h1>Не услышал</h1>
      <time datetime="31.12.2020">31.12.2020</time>
      <div class="seo-poem__text"><p>Прерывисто звучала птица,<br>
блеща безумием зрачков,<br>
и в тьму хотела углубиться<br>
высоковольтных облаков.</p>
<p>Я не услышал птичье слово,<br>
грозу я наискось прошел,<br>
я был напрасен и неловок,<br>
я был - и это хорошо.</p></div>
    </article>
  </main>
