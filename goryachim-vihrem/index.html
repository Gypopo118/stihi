      <h1>Горячим вихрем</h1>
      <time datetime="17.04.2000">17.04.2000</time>
      <div class="seo-poem__text"><p>Горячим вихрем - звоны птиц,<br>
И зелени бушует юность.<br>
Во мгле распахнутых ресниц -<br>
Пространства солнечность и лунность.</p>
<p>Огромность мира не пуста,<br>
Всегда наполненная светом;<br>
Ночуют воробьи в кустах<br>
Чтоб в тишь рассыпаться с рассветом.</p></div>
