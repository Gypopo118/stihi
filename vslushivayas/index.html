      <h1>Вслушиваясь</h1>
      <time datetime="19.11.2018">19.11.2018</time>
      <div class="seo-poem__text"><p>Меня надкусывало яблоко<br>
с грустящим хрустом сентября.<br>
Густыми горестными ямбами<br>
вороны сыпали, скорбя.</p>
<p>И, вслушиваясь в тьму осеннюю,<br>
в тончайшей горечи дождя<br>
искал я Слово о спасении,<br>
лишь ор вороний находя.</p></div>
