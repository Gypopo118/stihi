    <a class="seo-poem__back" href="/">Все стихотворения</a>
    <article>
      <h1>Не бывает</h1>
      <time datetime="14.12.2025">14.12.2025</time>
      <div class="seo-poem__text"><p>Ты слышишь - сверчки запевают,<br>
зенитка грохочет во тьму...<br>
Мы счастливы. Так не бывает.<br>
Давай я тебя обниму.</p>
<p>Давай, рассуждая пространно,<br>
обсудим новинки кино,<br>
пусть рядом, как тихая рана,<br>
горит после взрыва окно.</p></div>
    </article>
  </main>
