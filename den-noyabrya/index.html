    <article>
      <h1>День ноября</h1>
      <time datetime="20.11.2018">20.11.2018</time>
      <div class="seo-poem__text"><p>В остановившемся пространстве дня<br>
застыли ледяные ливни,<br>
и медленного года шестерня<br>
сегодня замерла, заклинив.</p>
<p>Сажусь читать и зажигаю бра.<br>
Ломаю тело апельсина.<br>
И в ржавом механизме ноября<br>
визжит несмазанная псина.</p></div>
    </article>
