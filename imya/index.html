      <h1>Имя</h1>
      <time datetime="20.04.2019">20.04.2019</time>
      <div class="seo-poem__text"><p>Прогорклое я имя повторял,<br>
и в воздухе перебродившем<br>
бродила мята тонких одеял<br>
и сумрак выглядел родившим.<br>
Прокисшее, с кислинкой, синевой,<br>
я имя потерял ночное.<br>
Ты не моя, да я и сам не свой,<br>
и ласково зверье ручное.</p>
<p>24.02.19</p></div>
