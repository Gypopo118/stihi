    <article>
      <h1>Бушующее</h1>
      <time datetime="04.09.2002">04.09.2002</time>
      <div class="seo-poem__text"><p>Прощай, бушующее небо,<br>
И вдохновленные леса,<br>
Вода, исполненная гнева,<br>
И удивленные глаза.<br>
Прощайте, запертые двери,<br>
И сквозняки на этажах,<br>
И одомашненные звери,<br>
И здравствуй, мой последний шаг.</p></div>
    </article>
