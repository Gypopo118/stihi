      <h1>Блуждали молнии</h1>
      <time datetime="21.06.2006">21.06.2006</time>
      <div class="seo-poem__text"><p>Блуждали молнии весь день,<br>
гроза ударила под вечер,<br>
гроза ударила везде,<br>
я стал безудержен и вечен.</p>
<p>В наклонных улицах дыша<br>
мгновенной яви потрясеньем<br>
иду к тебе, и каждый шаг -<br>
спасенье.</p></div>
    </article>
