    <article>
      <h1>Шевелясь</h1>
      <time datetime="12.10.2018">12.10.2018</time>
      <div class="seo-poem__text"><p>Что-то голуби начали дохнуть,<br>
растрепавшись на сонном ветру,<br>
и с бессильем последнего вздоха<br>
на асфальте лежат поутру.</p>
<p>Облака, шевелясь, пролетают<br>
над изменчивым ликом земли,<br>
и молитвенный кот наблюдает<br>
за биением крыльев в пыли.</p></div>
    </article>
