    <article>
      <h1>Спустится вода</h1>
      <time datetime="03.06.2019">03.06.2019</time>
      <div class="seo-poem__text"><p>Людской поток сойдёт на нет,<br>
исчезну я и остальные,<br>
когда троллейбус-людоед<br>
раздвинет челюсти стальные.</p>
<p>И поведут нас провода,<br>
за горизонтом пропадая,<br>
и с неба спустится вода,<br>
высокая и молодая.</p>
<p>19.04.19</p></div>
    </article>
