    <a class="seo-poem__back" href="/">Все стихотворения</a>
    <article>
      <h1>Мы изобразить</h1>
      <time datetime="17.08.2008">17.08.2008</time>
      <div class="seo-poem__text"><p>Как ни пытались мы изобразить<br>
простую дружбу - все же не похоже.<br>
И в этот миг мне не остановить<br>
твоих ногтей, крадущихся по коже.</p>
<p>Горячий лёд течет как три змеи,<br>
и губы сохнут и шуршат о плечи,<br>
и посреди неслыханной зимы<br>
пересеклись исканья человечьи.</p></div>
    </article>
