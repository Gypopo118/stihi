      <h1>Всю зиму</h1>
      <time datetime="18.04.2001">18.04.2001</time>
      <div class="seo-poem__text"><p>Л.Н.</p>
<p>Всю зиму я провел в борьбе<br>
за жизнь твою, но ты всё та же;<br>
И лишь при мысли о тебе<br>
меня охватывает тяжесть.</p>
<p>Я убежден твоей тоской -<br>
пути в иное бесполезны.<br>
Вот и ко мне пришел покой<br>
тебя не возвратившей бездны.</p></div>
    </article>
