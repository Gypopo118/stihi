    <article>
      <h1>Смотрит</h1>
      <time datetime="18.10.2018">18.10.2018</time>
      <div class="seo-poem__text"><p>Слепые осы солнечного холода.<br>
Соленый приступ неба голубого.<br>
Я выгляжу отверженно и молодо,<br>
как сын несуществующего бога.</p>
<p>Автомобиль чихает, не заводится,<br>
туман разбит дворами на квадраты,<br>
и свежекупленная богородица<br>
в глаза мне смотрит с горечью утраты.</p></div>
    </article>
