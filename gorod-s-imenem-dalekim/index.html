      <h1>Город с именем далеким</h1>
      <time datetime="07.08.2001">07.08.2001</time>
      <div class="seo-poem__text"><p>Как страшна увиденная кровь,<br>
Тихо покидающая тело,<br>
Так и я, родной покинув кров,<br>
Страшен, стоя тут осиротело.</p>
<p>Город с именем далеким! Ты<br>
Станешь мне опорой и ответом.<br>
Сколько б ни было здесь пустоты,<br>
Я её наполню новым светом.</p></div>
