    <article>
      <h1>Ты уходишь</h1>
      <time datetime="24.10.2014">24.10.2014</time>
      <div class="seo-poem__text"><p>Ты уходишь снящейся дорогой<br>
С тёмным ветром, дышащим в груди.<br>
Ты ушла, слепая недотрога,<br>
Горизонт оставив позади.</p>
<p>Белые страницы нашей книги<br>
Я читал, и слушал в пустоте<br>
Дальние, немолкнущие крики<br>
Наших неродившихся детей.</p></div>
    </article>
