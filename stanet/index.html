      <h1>Станет</h1>
      <time datetime="21.08.2001">21.08.2001</time>
      <div class="seo-poem__text"><p>В дождливом парке на скамье -<br>
женский силуэт с сигаретой.<br>
Осмейте меня, младенцы,<br>
за жалость к ней!<br>
Ваш скорбный, отчаянный смех<br>
станет моими крыльями.<br>
А время летит, вращая Землей,<br>
срывая цветы затуманенных лиц,<br>
и темный, неразговорчивый,<br>
я с нею<br>
яснею.</p></div>
