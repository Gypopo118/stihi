    <article>
      <h1>Только звук</h1>
      <time datetime="14.06.2026">14.06.2026</time>
      <div class="seo-poem__text"><p>Как же ты застенчива была! тест<br>
Фонарём увенчана была.<br>
И жужжали зло БПЛА<br>
в роскоши рассвета.<br>
Солнце поднималось надо мной.<br>
В тонком небе зачинался зной.<br>
Только звук, единственный и злой,<br>
нам поёт, что будет жарким лето.</p></div>
    </article>
