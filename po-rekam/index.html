    <article>
      <h1>По рекам</h1>
      <time datetime="13.03.2014">13.03.2014</time>
      <div class="seo-poem__text"><p>Смех твой<br>
по рекам умчится,<br>
и ветви<br>
будут искриться.<br>
Оставив улыбку на память<br>
непрошенной ночи, уйдёшь.<br>
Весна. Неначавшийся дождь.</p></div>
    </article>
