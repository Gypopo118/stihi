    <article>
      <h1>Рассмеюсь</h1>
      <time datetime="28.02.2019">28.02.2019</time>
      <div class="seo-poem__text"><p>Свет юный и ласковый, где ты?<br>
Скажи - мы горели не зря?<br>
Мои нерожденные дети<br>
смеются во мгле ноября.</p>
<p>И я рассмеюсь ослепленно,<br>
и чуду возрадуюсь сам...<br>
И ветки остывшего клёна<br>
воздеты к пустым небесам.</p>
<p>10.01.19</p></div>
