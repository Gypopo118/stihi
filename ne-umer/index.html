    <article>
      <h1>Не умер</h1>
      <time datetime="09.12.2017">09.12.2017</time>
      <div class="seo-poem__text"><p>Не умер я, я просто отдыхаю<br>
Сильнее чем обычно - от дыханья,<br>
От тока крови, от деленья клеток,<br>
От гормональных факторов любви…<br>
Когда ты вновь повеселеешь к лету,<br>
Цветы, что из меня растут, сорви.</p></div>
