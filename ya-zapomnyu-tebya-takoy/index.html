    <article>
      <h1>Я запомню тебя такой</h1>
      <time datetime="13.01.2014">13.01.2014</time>
      <div class="seo-poem__text"><p>Смейся под небом,<br>
плачущим над тобой.</p>
<p>Стань струям сестрой.</p>
<p>Стань оправданьем<br>
хладным дождям,<br>
сумрачным зданьям,<br>
ложным путям.</p>
<p>Смейся под небом,<br>
нашедшая в струях покой.</p>
<p>Я запомню тебя такой.</p>
<p>2003 г.</p></div>
    </article>
