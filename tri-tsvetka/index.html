      <h1>Три цветка</h1>
      <time datetime="21.06.2006">21.06.2006</time>
      <div class="seo-poem__text"><p>Три цветка расцвели под елью.<br>
Три цветка сожжены метелью.</p>
<p>В тень дорога ведет слепая.<br>
Ты проснешься, по ней ступая.</p>
<p>Три цветка сожжены тобою.<br>
Стань должницею и рабою.</p></div>
