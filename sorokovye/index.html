        <time datetime="12.07.2018">12.07.2018</time>
        <div class="seo-poem__text"><p>Над стройками кипящими взлетала<br>
Могучая труба из кирпича,<br>
И за страной следила с пьедестала<br>
Гранитная личина Ильича.</p>
<p>Крестьянское соломенное сердце<br>
Пылало под скрипучим сапогом<br>
Индустриализации, и сердится<br>
Иосиф в помещении нагом.</p>
<p>Его усы уверенней и больше<br>
Немецких. А на карте нагишом<br>
Лежащее младое тело Польши<br>
Поделено тупым карандашом.</p>
<p>Отлитые из урожая танки<br>
Ползли навстречу некрасивой тьме<br>
И черные заплаканные Таньки<br>
Махали вслед шагающему мне.</p>
<p>Мы заводили песню без названья<br>
И подпевали пули нам в пути.<br>
Упал в болото безымянный Ваня<br>
И нам удобно по нему идти.</p>
<p>Сердца горели и горели сёла,<br>
Седели потрясенные леса,<br>
И с песней разудалой и веселой<br>
Мы уходили прямо в небеса.</p></div>
      </article>
