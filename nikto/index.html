    <article>
      <h1>Никто</h1>
      <time datetime="24.10.2018">24.10.2018</time>
      <div class="seo-poem__text"><p>Надела липа желтое пальто,<br>
ветшающее тут же понемногу,<br>
и ветхость эту сыплет на дорогу,<br>
и по дороге не идет никто.</p>
<p>Никто не наблюдает наготу<br>
растерянных ветвей оледенелых,<br>
лишь птица голубая прозвенела<br>
и в синюю упала пустоту.</p></div>
    </article>
