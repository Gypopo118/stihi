    <article>
      <h1>Торфяники</h1>
      <time datetime="20.10.2015">20.10.2015</time>
      <div class="seo-poem__text"><p>Четвертый день горят торфяники<br>
И ветры дымные горчат.<br>
И как загаженные веники<br>
Деревья черные торчат.</p>
<p>Мы развернули шланги, тушим.<br>
Белеют пятнами глаза.<br>
Упорная, по нашу душу<br>
Огня крадется полоса.</p></div>
    </article>
