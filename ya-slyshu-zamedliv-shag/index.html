      <h1>Я слышу, замедлив шаг</h1>
      <time datetime="08.06.2014">08.06.2014</time>
      <div class="seo-poem__text"><p>Я слышу, замедлив шаг,<br>
когда не звенят кусты,<br>
и вопли густых собак,<br>
и визг воробьёв пустых.</p>
<p>А ветер идёт стеной,<br>
траву под собой клоня,<br>
и гонит в огромный зной,<br>
в безумье и прелесть дня.</p>
<p>11.03.2000г</p></div>
