    <article>
      <h1>Прошла</h1>
      <time datetime="02.12.2018">02.12.2018</time>
      <div class="seo-poem__text"><p>Отчего голова тяжела,<br>
и спокойствия как ни бывало?<br>
Просто молодость мимо прошла<br>
и меня, проходя, не узнала.</p>
<p>И чужие звенят голоса,<br>
и колышется смех посторонний,<br>
и шумит, оглашая леса,<br>
несмолкающий праздник вороний.</p></div>
    </article>
