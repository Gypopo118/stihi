    <article>
      <h1>Не ищи</h1>
      <time datetime="21.02.2017">21.02.2017</time>
      <div class="seo-poem__text"><p>Позабыв про свою обреченность,<br>
Посещу я родительский дом,<br>
Где деревьев высокая черность<br>
Вся пронизана светлым дождем.</p>
<p>Ветки пляшут в рассеянной влаге,<br>
Всё исчезло в кромешном дожде.<br>
Я остался на этой бумаге,<br>
Не ищи меня больше нигде.</p>
<p>21.02.17</p></div>
