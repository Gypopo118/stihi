    <article>
      <h1>Распался</h1>
      <time datetime="14.03.2021">14.03.2021</time>
      <div class="seo-poem__text"><p>Уютный домик мой распался,<br>
стоит одна стена с окном,<br>
зато я хорошо проспался<br>
и напитал себя вином.</p>
<p>Теперь безумие восхода<br>
ко мне восходит на крыльцо,<br>
и злая добрая природа<br>
бросает листья мне в лицо.</p></div>
    </article>
