    <article>
      <h1>Остыла</h1>
      <time datetime="06.09.2015">06.09.2015</time>
      <div class="seo-poem__text"><p>Лучи прохладного светила<br>
пронзили всю листву насквозь.<br>
Остыло все, и ты остыла,<br>
слова роняя, будто вскользь.</p>
<p>К утру вспотела мостовая,<br>
туман в булыжники впитав.<br>
Лишь небо знает, остывая,<br>
молекулярный твой состав.</p></div>
    </article>
