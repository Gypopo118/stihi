    <article>
      <h1>Кино</h1>
      <time datetime="03.06.2017">03.06.2017</time>
      <div class="seo-poem__text"><p>Дождь струится по собаке,<br>
по её ребристым бокам.<br>
Собака  нашла<br>
человечьи глаза<br>
и носит их вместо своих.<br>
Модница.<br>
В этих глазах,<br>
как в двух телевизорах,<br>
идет плохое кино.<br>
А хорошее кино не идет -<br>
оно замерло и стоит<br>
неподалеку,<br>
за высоким стеклом витрин.</p></div>
    </article>
