    <article>
      <h1>Нет смерти</h1>
      <time datetime="19.10.2000">19.10.2000</time>
      <div class="seo-poem__text"><p>Нет смерти в лесах осенних.<br>
Не бродит, живое ищущая.<br>
Листва, леденяще дышащая,<br>
истлеет для воскресенья.</p>
<p>На ветках, озябших тоще,<br>
листы в пожелтелом ужасе<br>
дрожат и даруют мужество<br>
тебе: ты воскреснешь тоже.</p></div>
    </article>
