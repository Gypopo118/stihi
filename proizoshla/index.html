    <article>
      <h1>Произошла</h1>
      <time datetime="24.02.2019">24.02.2019</time>
      <div class="seo-poem__text"><p>Вчера произошла зима,<br>
как происходит преступленье.<br>
И ужаснулась ты сама<br>
своей неистребимой лени.</p>
<p>Не в силах выглянуть в окно,<br>
ты тише шепота любого,<br>
а в мире всё возбуждено<br>
по факту снега голубого.</p>
<p>06.01.19</p></div>
    </article>
