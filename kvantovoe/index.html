    <article>
      <h1>Квантовое</h1>
      <time datetime="09.03.2019">09.03.2019</time>
      <div class="seo-poem__text"><p>Черты рассеянного облика<br>
заметил я в дожде теперь лишь.<br>
Ты - вероятностное облако<br>
и наблюдателя не терпишь.</p>
<p>Когда теория рождается<br>
и тут же терпит пораженье,<br>
лапласов демон разрыдается,<br>
не угадав твоё движенье.</p>
<p>29.01.19</p></div>
