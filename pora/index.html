      <h1>Пора</h1>
      <time datetime="03.11.2019">03.11.2019</time>
      <div class="seo-poem__text"><p>Очарования неброского<br>
полна  промозглая пора,<br>
и, как произведенья Бродского,<br>
темны и длинны вечера.</p>
<p>Округа выглядит ограбленно.<br>
Проносятся пустые дни,<br>
и, как произведенья Скрябина,<br>
светлы и коротки они.</p></div>
    </article>
