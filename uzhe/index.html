    <article>
      <h1>Уже</h1>
      <time datetime="23.02.2025">23.02.2025</time>
      <div class="seo-poem__text"><p>Родившись, мы уже мертвы.<br>
Мы видим временные вещи.<br>
Твой силуэт проходит вещий<br>
среди застенчивой травы.</p>
<p>И я кричу тебе вослед<br>
немолодыми голосами:<br>
откуда пахнет волосами,<br>
ведь не было тебя и нет?</p></div>
    </article>
