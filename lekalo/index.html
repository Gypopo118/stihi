    <article>
      <h1>Лекало</h1>
      <time datetime="01.08.2021">01.08.2021</time>
      <div class="seo-poem__text"><p>Крестообразно стрекоза<br>
припала к снегу как лекало.<br>
Двойная тонкая слеза<br>
твоё лицо пересекала.</p>
<p>Ложился камень декабря<br>
на грудь, и руки холодели,<br>
и птицы реяли, оря,<br>
как злые авиамодели.</p></div>
