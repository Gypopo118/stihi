    <article>
      <h1>Я вижу время</h1>
      <time datetime="19.02.2014">19.02.2014</time>
      <div class="seo-poem__text"><p>Я вижу время, мчащееся мимо,<br>
я вижу снег, блуждающий во тьме.<br>
Ты в феврале пройдёшь неповторимо,<br>
и лишь во сне вернёшься ты ко мне.</p>
<p>Твоя улыбка в дыме сигаретном<br>
блеснёт почудившейся мне слезой.<br>
Как много лет нам!<br>
Слезай!</p>
<p>2003*</p></div>
