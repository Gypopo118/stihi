      <time datetime="16.05.2015">16.05.2015</time>
      <div class="seo-poem__text"><p>Я не солдат, в том не моя вина.<br>
Я лишь увижу, отойдя в сторонку,<br>
Как разрывает новая война<br>
Снарядом новым старую воронку.</p></div>
