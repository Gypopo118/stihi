    <article>
      <h1>Озарил</h1>
      <time datetime="15.06.2001">15.06.2001</time>
      <div class="seo-poem__text"><p>Я смотрю в твое розовое окошко.<br>
Мертвящий фонарь озарил лицо.<br>
Уставшая ускользать кошка<br>
беззвучно ушла под колесо<br>
бесшумного автомобиля. Все же<br>
я торчу здесь ночами зря<br>
в ровном свете окна и в дрожи<br>
нездорового желтушного фонаря.</p></div>
    </article>
