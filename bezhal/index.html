      <h1>Бежал</h1>
      <time datetime="07.07.2019">07.07.2019</time>
      <div class="seo-poem__text"><p>Я бежал через Красную Площадь,<br>
как бегут хомяки в колесе.<br>
Неказистое имя Алеша<br>
я носил как печать на лице.</p>
<p>Я седел и светился белесо<br>
посреди непосильного дня.<br>
Материнские тайные слезы<br>
догоняли как эхо меня.</p>
<p>28.04.19</p></div>
