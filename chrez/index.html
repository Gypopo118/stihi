    <article>
      <h1>Чрез</h1>
      <time datetime="17.07.2018">17.07.2018</time>
      <div class="seo-poem__text"><p>Белел лица овал.<br>
Ноябрь опал и гол.<br>
Я скупо целовал<br>
край платья твоего.</p>
<p>Сквозь ржавчину ветвей,<br>
чрез вопли воронья<br>
бежишь ты все быстрей,<br>
и всё быстрее - я.</p>
<p>Ноябрь остыл, устал.<br>
Он пуст и разорен.<br>
И вопиют уста<br>
ворон... ворон... ворон...</p></div>
    </article>
