    <article>
      <h1>Шагну</h1>
      <time datetime="22.05.2022">22.05.2022</time>
      <div class="seo-poem__text"><p>Дождь наступает как расплата<br>
за пролетевший день пустой,<br>
и медленная скрипка плача<br>
колышет тонкий сухостой.</p>
<p>Я прогуляюсь по опушке,<br>
шагну к реке, пойду ко дну,<br>
а роженицы, словно пушки,<br>
палят по завтрашнему дню.</p></div>
    </article>
