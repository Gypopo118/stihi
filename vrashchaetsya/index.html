      <h1>Вращается</h1>
      <time datetime="26.01.2017">26.01.2017</time>
      <div class="seo-poem__text"><p>Прохожих ночных колыхая,<br>
безумно поет о былом<br>
и бьется в руках, затихая,<br>
метель с перебитым крылом.</p>
<p>Мы ходим по краю, по кромке,<br>
и город под ветреный вой<br>
вращается, словно воронка,<br>
и кладбище в центре его.</p>
<p>2015</p></div>
