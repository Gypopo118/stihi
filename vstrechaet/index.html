    <article>
      <h1>Встречает</h1>
      <time datetime="10.10.2017">10.10.2017</time>
      <div class="seo-poem__text"><p>Меня, уже не молодого<br>
и утонувшего в вине,<br>
встречает пьяная Молдова<br>
и выпить предлагает мне.</p>
<p>Здесь будет без вина не сладко,<br>
здесь будет горе от ума,<br>
здесь грузопассажирская лошадка<br>
бредёт в туман.</p></div>
    </article>
