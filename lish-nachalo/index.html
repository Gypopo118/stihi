    <article>
      <h1>Лишь начало</h1>
      <time datetime="20.09.2016">20.09.2016</time>
      <div class="seo-poem__text"><p>А сегодня вдруг похолодало,<br>
Листья рушатся, ветер хрипит,<br>
Рябь на лужах - и это начало,<br>
Лишь начало потерь и обид.</p>
<p>Но я чувствам неясным не верю,<br>
Если жив - значит жизнь хороша.<br>
Просто ветер поет о потерях,<br>
Просто вторит, как эхо, душа.</p>
<p>2001</p></div>
