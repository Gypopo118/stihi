      <h1>А на улице - тишь да тишь</h1>
      <time datetime="08.06.2014">08.06.2014</time>
      <div class="seo-poem__text"><p>А на улице - тишь да тишь.<br>
Пролетает то день, то ночь.<br>
Отчего же и ты молчишь,<br>
В забытьё не уходишь прочь?</p>
<p>Пусть деревья сковал мороз,<br>
Вижу мир я теперь иной:<br>
Ведь от высохших пыльных роз<br>
Веет временем и весной.</p></div>
