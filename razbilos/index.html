    <article>
      <h1>Разбилось</h1>
      <time datetime="22.08.2014">22.08.2014</time>
      <div class="seo-poem__text"><p>Разбилось об ноги тугое кольцо<br>
Волны.<br>
Печать материнства легла на лицо<br>
Луны.</p>
<p>И шепот и тишь, и прибой будто ждет.<br>
Я жду.<br>
И желтая маска за тучи уйдет.<br>
К дождю.</p>
<p>2009</p></div>
