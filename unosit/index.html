    <article>
      <h1>Уносит</h1>
      <time datetime="11.01.2014">11.01.2014</time>
      <div class="seo-poem__text"><p>Слышится ветер.<br>
Сонный песок не слышен.<br>
Струи песка. Волос<br>
Мечущийся в тиши.</p>
<p>Море смывает слезы,<br>
Море года уносит.<br>
Море ласкает ступни<br>
Холодностью бескрайней.</p>
<p>ок 2003</p></div>
