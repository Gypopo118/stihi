    <a class="seo-poem__back" href="/">Все стихотворения</a>
    <article>
      <h1>Но не успею</h1>
      <time datetime="13.09.2025">13.09.2025</time>
      <div class="seo-poem__text"><p>Пока сияет высь необъяснимая,<br>
пока высокий город мой горит,<br>
день погибает, заодно и с ним я,<br>
и я хочу успеть договорить.</p>
<p>Но не успею. Может, и не надо.<br>
Пусть говорят высокие дожди -<br>
их строгая, безумная прохлада,<br>
ложащаяся камнем на груди.</p></div>
    </article>
