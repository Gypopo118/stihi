    <article>
      <h1>Ко дну</h1>
      <time datetime="28.05.2017">28.05.2017</time>
      <div class="seo-poem__text"><p>Дома ушли. Они пошли ко дну.<br>
Нащупав дно, чуть колыхался город.<br>
На берег вынесло тебя одну,<br>
уснувшую застенчиво и голо.</p>
<p>Во рту горчили нужные слова.<br>
Вверху горчило нечто голубое.<br>
В горчащих чащах<br>
чахла синева,<br>
и ветви колыхались в такт прибою.</p></div>
