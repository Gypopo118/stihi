    <article>
      <h1>Угаснет день в высоких</h1>
      <time datetime="22.07.2002">22.07.2002</time>
      <div class="seo-poem__text"><p>Угаснет день в высоких рощах,<br>
утихнет шорох ржавых веток.<br>
Листва осталась без ответа.<br>
Мир стал прозрачнее и проще.</p>
<p>Лицо моё в свеченьи лунном!<br>
Хочу я от тебя отречься.<br>
Хочу минувшим днём согреться,<br>
чтоб вновь свободным стать и юным.</p></div>
