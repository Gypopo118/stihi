    <article>
      <h1>Утром</h1>
      <time datetime="06.07.2016">06.07.2016</time>
      <div class="seo-poem__text"><p>Просторным белым утром<br>
Всего одним глотком<br>
Знаком я стал кому-то<br>
И кто-то - мне знаком.<br>
Легко носились птицы,<br>
Шуршали облака.<br>
Вдруг поднялись ресницы<br>
Движеньем мотылька.<br>
Полуденного жара<br>
Нам хватит для двоих.<br>
И тень моя лежала<br>
У тонких ног твоих.</p>
<p>24.01.2000г</p></div>
