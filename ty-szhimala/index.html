    <article>
      <h1>Ты сжимала</h1>
      <time datetime="26.07.2016">26.07.2016</time>
      <div class="seo-poem__text"><p>Ты сжимала пол-лимона,<br>
Пол-лимона ты сжимала,<br>
Капли сыпались со звоном,<br>
Но тебе все было мало.<br>
Капли немощные брызжут,<br>
Ты сильнее жмешь, серчая.<br>
Фрукт избит, удушен, выжат,<br>
И нельзя отведать чая.</p>
<p>18.02.2000г</p></div>
