      <h1>Образовав воронку</h1>
      <time datetime="25.05.2000">25.05.2000</time>
      <div class="seo-poem__text"><p>Образовав воронку<br>
Замедленной метели,<br>
Над городом вороны<br>
Кричали и летели.</p>
<p>И хочется мне с ними<br>
Лететь навстречу дали -<br>
Забыв земное имя,<br>
Что мне когда-то дали.</p></div>
    </article>
