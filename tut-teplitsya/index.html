    <article>
      <h1>Тут теплится</h1>
      <time datetime="07.03.2019">07.03.2019</time>
      <div class="seo-poem__text"><p>Тут теплится прозрачное дрожанье<br>
и угасает, алого алей,<br>
тут замороженной осы жужжанье<br>
и восклицанье белых тополей.</p>
<p>Моих волос заиндевелый шелест<br>
летит и тает на исходе дня,<br>
и тонкий смех сочится через щели<br>
твоих дверей, закрытых для меня.</p>
<p>20.01.19</p></div>
